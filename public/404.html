<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        div {
            transform-style: preserve-3d;
        }

        .rail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(-30deg) rotateY(-30deg);
            z-index: 1;
            pointer-events: none;
        }

        .rail .stamp {
            position: absolute;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(20, 20, 20, 1);
            color: #ff1205;
            font-size: 7rem;
            font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        }

        .rail .stamp:nth-child(1) {
            animation: stampSlide 40000ms -2300ms linear infinite;
        }

        .rail .stamp:nth-child(2) {
            animation: stampSlide 40000ms -4300ms linear infinite;
        }

        .rail .stamp:nth-child(3) {
            animation: stampSlide 40000ms -6300ms linear infinite;
        }

        .rail .stamp:nth-child(4) {
            animation: stampSlide 40000ms -8300ms linear infinite;
        }

        .rail .stamp:nth-child(5) {
            animation: stampSlide 40000ms -10300ms linear infinite;
        }

        .rail .stamp:nth-child(6) {
            animation: stampSlide 40000ms -12300ms linear infinite;
        }

        .rail .stamp:nth-child(7) {
            animation: stampSlide 40000ms -14300ms linear infinite;
        }

        .rail .stamp:nth-child(8) {
            animation: stampSlide 40000ms -16300ms linear infinite;
        }

        .rail .stamp:nth-child(9) {
            animation: stampSlide 40000ms -18300ms linear infinite;
        }

        .rail .stamp:nth-child(10) {
            animation: stampSlide 40000ms -20300ms linear infinite;
        }

        .rail .stamp:nth-child(11) {
            animation: stampSlide 40000ms -22300ms linear infinite;
        }

        .rail .stamp:nth-child(12) {
            animation: stampSlide 40000ms -24300ms linear infinite;
        }

        .rail .stamp:nth-child(13) {
            animation: stampSlide 40000ms -26300ms linear infinite;
        }

        .rail .stamp:nth-child(14) {
            animation: stampSlide 40000ms -28300ms linear infinite;
        }

        .rail .stamp:nth-child(15) {
            animation: stampSlide 40000ms -30300ms linear infinite;
        }

        .rail .stamp:nth-child(16) {
            animation: stampSlide 40000ms -32300ms linear infinite;
        }

        .rail .stamp:nth-child(17) {
            animation: stampSlide 40000ms -34300ms linear infinite;
        }

        .rail .stamp:nth-child(18) {
            animation: stampSlide 40000ms -36300ms linear infinite;
        }

        .rail .stamp:nth-child(19) {
            animation: stampSlide 40000ms -38300ms linear infinite;
        }

        .rail .stamp:nth-child(20) {
            animation: stampSlide 40000ms -40300ms linear infinite;
        }

        @keyframes stampSlide {
            0% {
                transform: rotateX(90deg) rotateZ(-90deg) translateZ(-200px) translateY(130px);
            }

            100% {
                transform: rotateX(90deg) rotateZ(-90deg) translateZ(-200px) translateY(-3870px);
            }
        }

        .world {
            position: relative;
            z-index: 1;
            transform: rotateX(-30deg) rotateY(-30deg);
            pointer-events: none;
        }

        .world .forward {
            position: absolute;
            animation: slide 2000ms linear infinite;
        }

        .world .box {
            width: 200px;
            height: 200px;
            transform-origin: 100% 100%;
            animation: roll 2000ms cubic-bezier(1.000, 0.010, 1.000, 1.000) infinite;
        }

        .world .box .wall {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(250, 250, 250, 1);
            box-sizing: border-box;
        }

        .world .box .wall::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 7rem;
            font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        }

        .world .box .wall:nth-child(1) {
            transform: translateZ(100px);
        }

        .world .box .wall:nth-child(2) {
            transform: rotateX(180deg) translateZ(100px);
        }

        .world .box .wall:nth-child(3) {
            transform: rotateX(90deg) translateZ(100px);
        }

        .world .box .wall:nth-child(3)::before {
            transform: rotateX(180deg) rotateZ(90deg) translateZ(-1px);
            animation: zeroFour 4000ms -2000ms linear infinite;
        }

        .world .box .wall:nth-child(4) {
            transform: rotateX(-90deg) translateZ(100px);
        }

        .world .box .wall:nth-child(4)::before {
            transform: rotateX(180deg) rotateZ(-90deg) translateZ(-1px);
            animation: zeroFour 4000ms -2000ms linear infinite;
        }

        .world .box .wall:nth-child(5) {
            transform: rotateY(90deg) translateZ(100px);
        }

        .world .box .wall:nth-child(5)::before {
            transform: rotateX(180deg) translateZ(-1px);
            animation: zeroFour 4000ms linear infinite;
        }

        .world .box .wall:nth-child(6) {
            transform: rotateY(-90deg) translateZ(100px);
        }

        .world .box .wall:nth-child(6)::before {
            transform: rotateX(180deg) rotateZ(180deg) translateZ(-1px);
            animation: zeroFour 4000ms linear infinite;
        }

        @keyframes zeroFour {
            0% {
                content: '4';
            }

            100% {
                content: '0';
            }
        }

        @keyframes roll {
            0% {
                transform: rotateZ(0deg);
            }

            85% {
                transform: rotateZ(90deg);
            }

            87% {
                transform: rotateZ(88deg);
            }

            90% {
                transform: rotateZ(90deg);
            }

            100% {
                transform: rotateZ(90deg);
            }
        }

        @keyframes slide {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-200px);
            }
        }

        .terminal-text {
            position: absolute;
            top: 5%;
            right: 5%;
            text-align: right;
            font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
            color: #fff;
            z-index: 100;
        }

        .terminal-text .line {
            font-size: 1rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .terminal-text .line::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .terminal-text a.home-link {
            display: inline-block;
            margin-top: 1.25rem;
            font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
            font-size: 0.95rem;
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 6px 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, background 0.2s ease, color 0.2s ease;
        }

        .terminal-text a.home-link.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .terminal-text a.home-link:hover {
            background: #fff;
            color: #000;
        }

        .terminal-text a.home-link::before {
            content: '> ';
        }
    </style>
</head>

<body>

    <div class="stage">
        <div class="rail">
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
            <div class="stamp four">4</div>
            <div class="stamp zero">0</div>
        </div>

        <div class="world">
            <div class="forward">
                <div class="box">
                    <div class="wall"></div>
                    <div class="wall"></div>
                    <div class="wall"></div>
                    <div class="wall"></div>
                    <div class="wall"></div>
                    <div class="wall"></div>
                </div>
            </div>
        </div>

        <div class="terminal-text">
            <div class="line" id="typed-line"></div>
            <a href="/" class="home-link" id="home-link">back to home</a>
        </div>
    </div>

    <script>
        (function () {
            var text = "$ oops this page didnt pass the quality checks.";
            var el = document.getElementById('typed-line');
            var link = document.getElementById('home-link');
            var i = 0;

            function typeChar() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    var delay = 80 + Math.random() * 90;
                    if (text.charAt(i - 1) === ' ') delay += 80;
                    setTimeout(typeChar, delay);
                } else {
                    link.classList.add('visible');
                }
            }

            setTimeout(typeChar, 300);
        })();
    </script>

</body>

</html>
